# YouCook2 speech-dense domain replication (ch6 §6.2 conditionality test).
# Same pipeline knobs as default.yaml; only paths differ. Queries are the
# benchmark's own step sentences; grounding = the annotated [start, end].

paths:
  data_root: data
  videos: data/youcook2/videos
  annotations: data/youcook2/annotations
  artifacts: artifacts_yc2
  frames: artifacts_yc2/frames
  transcripts: artifacts_yc2/transcripts
  ocr: artifacts_yc2/ocr
  embeddings: artifacts_yc2/embeddings
  chroma: artifacts_yc2/chroma

device: auto

frames:
  detector: adaptive
  threshold: 3.0
  min_scene_len: 15
  uniform_fps: 0.5
  max_frames_per_video: 64
  resize_long_side: 384

transcribe:
  model: large-v3
  compute_type: int8
  language: null
  vad_filter: true
  beam_size: 5

ocr:
  enabled: false

embed:
  backbone: ViT-B-32          # match the NExT-QA W3 baseline for a like-for-like replication
  pretrained: laion2b_s34b_b79k
  batch_size: 32

segment:
  window_sec: 8.0
  stride_sec: 4.0

rerank:
  method: visual
  candidates: 30
  retrieval_weight: 0.5
  visual_backbone: ViT-L-14
  visual_pretrained: laion2b_s32b_b82k
  visual_embeddings: artifacts_yc2/embeddings_vitl
  model: BAAI/bge-reranker-v2-m3
  batch_size: 32

agent:
  provider: deepseek
  model: deepseek-chat
  k: 6
  modality: visual
  alpha: 0.8
  max_images: 6
  max_tokens: 16000
